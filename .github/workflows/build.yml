name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# 连续推送只跑最后一次，避免排队浪费 macOS 分钟数
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          brew install ldid xz
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          make clean || true
          make -j4
          echo "--- artifacts ---"
          find .theos -name "*.dylib" -print

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: ReelsDateFilter-dylib
          path: |
            .theos/obj/**/*.dylib
            .theos/obj/*.dylib
          if-no-files-found: error
